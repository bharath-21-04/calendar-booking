<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solstice Pilates — Chat with Sol</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #chat-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 420px;
      max-width: 98vw;
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    #chat-header {
      background: #2d6a4f;
      color: #fff;
      padding: 16px 20px;
      border-radius: 12px 12px 0 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    #chat-header small { font-weight: 400; font-size: 0.82rem; opacity: 0.82; display: block; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.45;
    }
    .msg.user {
      background: #2d6a4f;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.sol {
      background: #eaf2ed;
      color: #1a1a1a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .msg.error {
      background: #fdecea;
      color: #b71c1c;
      align-self: center;
      font-size: 0.88rem;
    }
    #input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #e8e8e3;
    }
    #user-input {
      flex: 1;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.95rem;
      outline: none;
    }
    #user-input:focus { border-color: #2d6a4f; }
    #send-btn {
      background: #2d6a4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #send-btn:disabled { opacity: 0.5; cursor: default; }
    #handoff-banner {
      display: none;
      background: #fff3cd;
      color: #856404;
      text-align: center;
      padding: 8px;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
<div id="chat-container">
  <div id="chat-header">
    Solstice Pilates
    <small>Chat with Sol — your AI receptionist</small>
  </div>
  <div id="handoff-banner">A team member will be with you shortly.</div>
  <div id="messages"></div>
  <div id="input-row">
    <input
      id="user-input"
      type="text"
      placeholder="Ask about classes, booking, pricing…"
      autocomplete="off"
    />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  const API_BASE = "http://localhost:8000";

  // Generate or reuse a session ID for this browser tab
  let sessionId = sessionStorage.getItem("sol_session_id");
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    sessionStorage.setItem("sol_session_id", sessionId);
  }

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");
  const bannerEl   = document.getElementById("handoff-banner");

  function appendMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function appendError(text) {
    appendMessage("error", "⚠ " + text);
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    sendBtn.disabled = true;
    appendMessage("user", text);

    try {
      const res = await fetch(API_BASE + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: text }),
      });

      if (!res.ok) {
        const err = await res.text();
        appendError("Server error (" + res.status + "): " + err);
        return;
      }

      const data = await res.json();
      appendMessage("sol", data.reply);

      if (data.handoff) {
        bannerEl.style.display = "block";
        inputEl.disabled = true;
        sendBtn.disabled = true;
      }
    } catch (err) {
      appendError("Could not reach the server. Please check your connection.");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) sendMessage();
  });

  // Greeting on load
  appendMessage("sol", "Hi! I'm Sol, your Solstice Pilates assistant. How can I help you today?");
  inputEl.focus();
</script>
</body>
</html>
